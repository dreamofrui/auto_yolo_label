# A9950站点Code转换规则配置
# 定义原始code与转换后code之间的映射关系

site_name: "A9950"
description: "A9950站点原始Code映射规则，用于将转换后的code还原成原始code"

# 产品 → 原始code 映射规则
# 按优先级顺序匹配，先匹配到的规则优先应用
product_mappings:
  # 规则1: M1_TO_T1 产品转换
  # 产品列表中的产品，T1_SP_PI_* 还原为 M1_SP_PI_*
  - original_code_prefix: "M1_SP_PI"
    converted_code_prefix: "T1_SP_PI"
    pro_pattern:
      - "238"
      - "270"
      - "430"
      - "156"
      - "215"
      - "245"
    exclude_products: []

  # 规则2: 小产品 judge 转换
  # 小产品的 M2_SP_PI_G 还原为 M2_SP_PI_P
  - original_code_prefix: "M2_SP_PI_P"
    converted_code_prefix: "M2_SP_PI_G"
    pro_pattern:
      - "020"
      - "047"
      - "050"
      - "055"
      - "056"
      - "057"
      - "058"
      - "059"
      - "060"
      - "061"
      - "062"
      - "063"
