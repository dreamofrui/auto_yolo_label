      - "087"
      - "088"
      - "089"
      - "090"
      - "091"
      - "092"
      - "093"
      - "094"
      - "095"
    exclude_products: []

  # 规则3: M2_TO_AS 转换（默认规则）
  # 其他产品的 AS_CV_PI_* 还原为 M2_SP_PI_*
  # exclude_products 列表中的产品保持 M2_SP_PI_*，不转换为 AS_CV_PI_*
  - original_code_prefix: "M2_SP_PI"
    converted_code_prefix: "AS_CV_PI"
    pro_pattern:
      - "*"  # 匹配所有产品
    exclude_products:
      # AS_TO_M2 产品列表（保持 M2_SP_PI，不转 AS_CV_PI）
